<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Sù Hotel Shanghai</title>
    <link rel="stylesheet" href="/CH_Module_D/css/main.css" />
    <link rel="icon" href="/CH_Module_D/media/brand/favicon.svg" />
  </head>
  <body>
    <!-- Global Header -->
    <header>
      <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
          <div class="navbar-brand">
            <img
              src="/CH_Module_D/media/brand/su-hotel-logo-light.svg"
              alt="The Su Hotel Shanghai Logo"
            />
          </div>
          <button
            class="navbar-toggler hidden-lg-up"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#globalHeader"
            aria-controls="globalHeader"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
          </button>
          <div class="collapse navbar-collapse" id="globalHeader">
            <ul class="navbar-nav me-auto mt-2 mt-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="#hotel">Hotel</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#rooms">Rooms</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#dining">Dining</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#wellness">Wellness</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#shanghai">Shanghai</a>
              </li>
            </ul>

            <button>Book your stay</button>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <!-- Hero / Stay Introduction -->
      <section id="hero">
        <picture>
          <source
            srcset="/CH_Module_D/media/images/hero-shanghai-hotel-mobile.webp"
            media="(width < 768px)"
          />
          <source
            srcset="/CH_Module_D/media/images/hero-shanghai-hotel.webp"
            media="(width >= 768px)"
          />
          <img
            src="/CH_Module_D/media/images/hero-shanghai-hotel.jpg"
            alt="The S\u00f9 Hotel terrace overlooking Suzhou Creek and the Shanghai skyline at blue hour."
          />
        </picture>

        <div class="container">
          <p class="eyebrow">A quiet address in a city of movement</p>
          <h1>Stay close to the soul of Shanghai</h1>
          <p>
            River light, Art Deco restraint and intuitive hospitality meet
            beside Suzhou Creek.
          </p>
          <div class="actions">
            <button>Book your stay</button>
            <a href="#hotel">
              Discover the hotel
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="16" height="16">
                <path
                  d="M6 16h19M18 9l7 7-7 7"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
              </svg>
            </a>
          </div>
        </div>
      </section>

      <!-- Hotel Story -->
      <section id="hotel">
        <div class="container">
          <img src="/CH_Module_D/media/images/story-lobby.webp" alt="A contemporary Art Deco hotel lobby with warm brass lighting and a curved staircase." />
          <div>
  
          </div>
          <p class="eyebrow">Hotel Story Eyebrow</p>
          <h2>Hotel Story Title</h2>
          <p></p>
          <hr />
          <div class="stats">
            
          </div>
        </div>
      </section>

      <!-- Rooms & Suites -->
      <section id="rooms"></section>

      <!-- Dining Experience -->
      <section id="dining"></section>

      <!-- Wellness & Amenities -->
      <section id="wellness"></section>

      <!-- Explore Shanghai -->
      <section id="shanghai"></section>
    </main>

    <!-- Footer -->
    <footer></footer>

    <script src="/CH_Module_D/js/main.js" type="module"></script>
  </body>
</html>
