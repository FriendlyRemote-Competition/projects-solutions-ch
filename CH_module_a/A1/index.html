<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A1</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      position: relative;
    }
    .ring {
      position: absolute;
      width: 110px;
      height: 110px;
    }
    .ring > div {
      width: 100px;
      height: 100px;
      position: absolute;
      border: 5px solid black;
      border-radius: 100%;
    }
    .blue {
      left: -140px;
    }
    .yellow {
      top: 60px;
      left: -70px;
    }
    .green {
      top: 60px;
      left: 70px;
    }
    .red {
      left: 140px;
    }
    .blue > div {
      border-color: blue;
    }
    .yellow > div {
      border-color: yellow;
    }
    .green > div {
      border-color: green;
    }
    .red > div {
      border-color: red;
    }
    .blue > :first-child,
    .black > :first-child {
      clip-path: polygon(0 0, 100% 0, 100% 100%);
      z-index: 5;
    }
    .yellow > :first-child,
    .green > :first-child {
      clip-path: polygon(0 0, 100% 0, 0 100%);
      z-index: 4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="ring blue">
      <div></div>
      <div></div>
    </div>
    <div class="ring yellow">
      <div></div>
      <div></div>
    </div>
    <div class="ring black">
      <div></div>
      <div></div>
    </div>
    <div class="ring green">
      <div></div>
      <div></div>
    </div>
    <div class="ring red">
      <div></div>
      <div></div>
    </div>
  </div>
</body>
</html>
