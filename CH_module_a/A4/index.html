<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A4</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: black;
      min-height: 100vh;
    }
    .container {
      display: flex;
      gap: 10px;
      height: 80px;
      align-items: end;
    }
    @keyframes animate {
      0% {
        height: 80px;
      }
      10% {
        height: 20px;
      }
      20% {
        height: 40px;
      }
      30% {
        height: 70px;
      }
      40% {
        height: 10px;
      }
      50% {
        height: 50px;
      }
      60% {
        height: 30px;
      }
      70% {
        height: 80px;
      }
      80% {
        height: 60px;
      }
      90% {
        height: 40px;
      }
      100% {
        height: 80px;
      }
    }
    .bar {
      background-color: #00d800;
      width: 20px;
      height: 80px;
      animation: animate 2s ease-in-out infinite;
    }
    .bar:nth-child(2) {
      animation-delay: -1s;
    }
    .bar:nth-child(3) {
      animation-delay: -1.5s;
    }
    .bar:nth-child(4) {
      animation-delay: -1.75s;
    }
    .bar:nth-child(5) {
      animation-delay: -1.8s;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</body>
</html>
